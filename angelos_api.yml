openapi: 3.0.3
info:
  title: Angelos Edge Agent API
  description: |
    HTTP API exposed by the **angelos** edge agent (`api_parser`) on each protected
    server. The Dorian **back-end** calls these endpoints directly; the Vue
    front-end never talks to angelos.

    **Base URL:** `http://{edge-server-ip}:5000`

    **Transport**

    - Method: `POST` for all endpoints documented here
    - Content-Type: `application/json`
    - Success: HTTP 2xx with empty or JSON body
    - Failure: non-2xx; Dorian surfaces this as HTTP 502 to dashboard clients

    **Scope**

    - **Server-scoped** calls target one edge node IP (e.g. listening ports,
      temporary blacklist).
    - **Site-scoped** calls are issued by Dorian once per edge server assigned
      to the site; each request carries that edge node's `serverId`.

    **L4 vs L7**

    - `/API/L7/*` — Layer 7 WAF, cache, upstream, compress (angelos)
    - `/API/L4/*` — Layer 4 firewall whitelist/blacklist and config (same agent
      port by default; paths configurable in Dorian `config.json`)

    This spec is derived from Dorian back-end callers in `internal/api/l7_site_push.go`,
    `internal/api/handlers.go`, and `internal/api/agent_client.go`.
  version: 1.0.0

servers:
  - url: http://{edgeServerIp}:5000
    description: Edge server running angelos
    variables:
      edgeServerIp:
        default: 203.0.113.10
        description: Public IP of the protected edge node

tags:
  - name: L7 WAF
  - name: L7 Traffic
  - name: L7 Cache
  - name: L4 Firewall

paths:
  /API/L7/l7_update_whitelist:
    post:
      tags: [L7 WAF]
      summary: Replace WAF whitelist rules
      description: Dorian trigger — site WAF whitelist create/update/delete/batch-delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7WhitelistUpdate"
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_blacklist:
    post:
      tags: [L7 WAF]
      summary: Replace WAF blacklist rules
      description: Dorian trigger — site WAF blacklist mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7BlacklistUpdate"
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_geolocation:
    post:
      tags: [L7 WAF]
      summary: Replace WAF geolocation rules
      description: Only rules with status ENABLE are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7GeolocationUpdate"
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_antiheader:
    post:
      tags: [L7 WAF]
      summary: Replace WAF anti-header rules
      description: Only enabled rules are sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7AntiHeaderUpdate"
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_intervalfreqlimit:
    post:
      tags: [L7 WAF]
      summary: Replace interval frequency limit rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7IntervalFreqLimitUpdate"
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_secondfreqlimit:
    post:
      tags: [L7 WAF]
      summary: Replace per-second frequency limit rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7SecondFreqLimitUpdate"
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_responsefreq:
    post:
      tags: [L7 WAF]
      summary: Replace response frequency rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7ResponseFreqUpdate"
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_useragent:
    post:
      tags: [L7 WAF]
      summary: Replace user-agent rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7UserAgentUpdate"
      responses:
        "200":
          description: Rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_temporaryblacklist:
    post:
      tags: [L7 WAF]
      summary: Replace temporary blacklist entries
      description: |
        Server-scoped. Dorian sends the full list when temporary blacklist rows
        are added or when syncing after agent reports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7TemporaryBlacklistUpdate"
      responses:
        "200":
          description: Blacklist applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_upstreamservers:
    post:
      tags: [L7 Traffic]
      summary: Replace upstream origin servers for a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7UpstreamServersUpdate"
      responses:
        "200":
          description: Upstreams applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_listeningports:
    post:
      tags: [L7 Traffic]
      summary: Replace listening ports on an edge server
      description: Server-scoped (not site-scoped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7ListeningPortsUpdate"
      responses:
        "200":
          description: Ports applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_compress:
    post:
      tags: [L7 Traffic]
      summary: Update Gzip compress MIME settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7CompressUpdate"
      responses:
        "200":
          description: Compress settings applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_update_cacherules:
    post:
      tags: [L7 Cache]
      summary: Replace cache rules
      description: Full rule set is sent on every create/update/delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7CacheRulesUpdate"
      responses:
        "200":
          description: Cache rules applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_clear_cache:
    post:
      tags: [L7 Cache]
      summary: Purge all file cache on the edge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7ServerIdOnly"
      responses:
        "200":
          description: Cache cleared
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L7/l7_clear_url_cache:
    post:
      tags: [L7 Cache]
      summary: Purge URL cache by match pattern
      description: |
        `match_type` is numeric on the wire (CDNRAY convention):

        - `1` — prefix match (`http(s)://…/` ending with `/`)
        - `2` — exact match (`http(s)://…`)
        - `3` — advanced wildcard (any non-empty pattern)

        Dorian normalizes dashboard input (`prefix`, `exact`, `advanced`) before
        calling angelos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L7ClearUrlCache"
            examples:
              prefix:
                summary: Prefix purge
                value:
                  serverId: 1033
                  match_type: 1
                  match_content: https://www.example.com/
              exact:
                summary: Exact URL purge
                value:
                  serverId: 1033
                  match_type: 2
                  match_content: https://www.example.com/index.html
              advanced:
                summary: Advanced wildcard purge
                value:
                  serverId: 1033
                  match_type: 3
                  match_content: www.example.com/*/api/*
      responses:
        "200":
          description: URL cache cleared
        "400":
          description: Invalid match_type or match_content
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/l4_firewall_data:
    post:
      tags: [L4 Firewall]
      summary: Push Layer 4 firewall configuration
      description: |
        Path defaults to `/API/L4/l4_firewall_data` (override via Dorian
        `agentL4Path` in config). Optional `Authorization: Bearer` header when
        `agentToken` is configured.
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4ConfigPush"
      responses:
        "200":
          description: L4 config applied
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/options:
    post:
      tags: [L4 Firewall]
      summary: Fetch attach interfaces and modes
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenBody"
      responses:
        "200":
          description: Available L4 options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/L4Options"
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/add_white_ip:
    post:
      tags: [L4 Firewall]
      summary: Add IP to L4 whitelist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4IpAction"
      responses:
        "200":
          description: IP whitelisted
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/remove_white_ip:
    post:
      tags: [L4 Firewall]
      summary: Remove IP from L4 whitelist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4IpAction"
      responses:
        "200":
          description: IP removed
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/remove_white_ip_all:
    post:
      tags: [L4 Firewall]
      summary: Clear L4 whitelist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenBody"
      responses:
        "200":
          description: Whitelist cleared
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/add_block_ip:
    post:
      tags: [L4 Firewall]
      summary: Add IP to L4 blocklist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4IpAction"
      responses:
        "200":
          description: IP blocked
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/remove_block_ip:
    post:
      tags: [L4 Firewall]
      summary: Remove IP from L4 blocklist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/L4IpAction"
      responses:
        "200":
          description: IP unblocked
        "4XX":
          $ref: "#/components/responses/AgentError"

  /API/L4/remove_block_ip_all:
    post:
      tags: [L4 Firewall]
      summary: Clear L4 blocklist
      parameters:
        - $ref: "#/components/parameters/AgentBearer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenBody"
      responses:
        "200":
          description: Blocklist cleared
        "4XX":
          $ref: "#/components/responses/AgentError"

components:
  parameters:
    AgentBearer:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Optional Bearer agentToken header when configured in Dorian back-end

  responses:
    AgentError:
      description: Angelos rejected or failed the request
      content:
        text/plain:
          schema:
            type: string

  schemas:
    L7ServerIdOnly:
      type: object
      required: [serverId]
      properties:
        serverId:
          type: integer
          format: int64
          description: Edge server ID in Dorian

    L7ServerContext:
      type: object
      required: [serverId, serverIp]
      properties:
        serverId:
          type: integer
          format: int64
        serverIp:
          type: string
          description: Edge node public IP

    L7WhitelistUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/WafWhitelistRule"

    L7BlacklistUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/WafBlacklistRule"

    L7GeolocationUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/WafGeoRule"

    L7AntiHeaderUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/WafAntiHeaderRule"

    L7IntervalFreqLimitUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/IntervalFreqLimitRule"

    L7SecondFreqLimitUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/SecondFreqLimitRule"

    L7ResponseFreqUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/ResponseFreqRule"

    L7UserAgentUpdate:
      allOf:
        - $ref: "#/components/schemas/L7ServerContext"
        - type: object
          properties:
            rules:
              type: array
              items:
                $ref: "#/components/schemas/UserAgentRule"

    L7TemporaryBlacklistUpdate:
      type: object
      required: [serverId, temporaryblacklist]
      properties:
        serverId:
          type: integer
          format: int64
        temporaryblacklist:
          type: array
          items:
            $ref: "#/components/schemas/TemporaryBlacklistEntry"

    L7UpstreamServersUpdate:
      type: object
      required: [serverId, upstreams]
      properties:
        serverId:
          type: integer
          format: int64
        upstreams:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamServerL7"

    L7ListeningPortsUpdate:
      type: object
      required: [serverId, listeningports]
      properties:
        serverId:
          type: integer
          format: int64
        listeningports:
          type: array
          items:
            $ref: "#/components/schemas/ListeningPortL7"

    L7CompressUpdate:
      type: object
      required: [serverId, compress]
      properties:
        serverId:
          type: integer
          format: int64
        compress:
          $ref: "#/components/schemas/CompressSettingsL7"

    L7CacheRulesUpdate:
      type: object
      required: [serverId, cacherules]
      properties:
        serverId:
          type: integer
          format: int64
        cacherules:
          type: array
          items:
            $ref: "#/components/schemas/CacheRuleL7"

    L7ClearUrlCache:
      type: object
      required: [serverId, match_type, match_content]
      properties:
        serverId:
          type: integer
          format: int64
        match_type:
          type: integer
          enum: [1, 2, 3]
          description: "1=prefix, 2=exact, 3=advanced"
        match_content:
          type: string

    WafWhitelistRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        wafRuleId:
          type: integer
          format: int64
        ips:
          type: string
        url:
          type: string
        method:
          type: string
        description:
          type: string

    WafBlacklistRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        wafRuleId:
          type: integer
          format: int64
        ips:
          type: string
        url:
          type: string
        method:
          type: string
        behavior:
          type: string
        description:
          type: string

    WafGeoRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        wafRuleId:
          type: integer
          format: int64
        country:
          type: string
        url:
          type: string
        behavior:
          type: string
        operation:
          type: string
        status:
          type: string
          enum: [ENABLE, DISABLE]

    WafAntiHeaderRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        wafRuleId:
          type: integer
          format: int64
        url:
          type: string
        header:
          type: string
        value:
          type: string
        blockMode:
          type: string
        behavior:
          type: string
        status:
          type: string
          enum: [ENABLE, DISABLE]

    IntervalFreqLimitRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        url:
          type: string
        time:
          type: integer
          description: Window length in seconds
        request_count:
          type: integer
        behavior:
          type: string
        status:
          type: string
          enum: [ENABLE, DISABLE]

    SecondFreqLimitRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        url:
          type: string
        request_count:
          type: integer
        burst:
          type: integer
        behavior:
          type: string
        status:
          type: string
          enum: [ENABLE, DISABLE]

    ResponseFreqRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        url:
          type: string
        response_code:
          type: string
        time:
          type: integer
        response_count:
          type: integer
        behavior:
          type: string
        status:
          type: string
          enum: [ENABLE, DISABLE]

    UserAgentRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        url:
          type: string
        user_agent:
          type: string
        match:
          type: string
        behavior:
          type: string
        status:
          type: string
          enum: [ENABLE, DISABLE]

    TemporaryBlacklistEntry:
      type: object
      properties:
        ip:
          type: string
        url:
          type: string
        country:
          type: string
        city:
          type: string
        blocked_at:
          type: string
        ttl:
          type: integer
          format: int64
        trigger_rule:
          type: string

    UpstreamServerL7:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        ip_port:
          type: string
          description: Origin address as IP:port
        protocol:
          type: string
        description:
          type: string

    ListeningPortL7:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        port:
          type: integer
        protocol:
          type: string
        description:
          type: string
        status:
          type: string

    CompressSettingsL7:
      type: object
      properties:
        css:
          type: boolean
        html:
          type: boolean
        js:
          type: boolean
        audio:
          type: boolean
        font:
          type: boolean
        applications:
          type: boolean

    CacheRuleL7:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        rule_name:
          type: string
        rule_type:
          type: string
          enum: [file, url]
        caching_time:
          type: integer
          description: TTL in seconds
        url:
          type: string
        file_types:
          type: string
          description: Comma-separated extensions for file rules
        priority:
          type: integer
        cache_slice:
          type: number
          format: double
        without_parameter:
          type: string
          enum: [yes, no]
        cache_mode:
          type: string
          enum: [origin, force]
        status:
          type: string
          enum: [ENABLE, DISABLE]

    AgentTokenBody:
      type: object
      properties:
        token:
          type: string
          description: Server or global agent token

    L4IpAction:
      type: object
      required: [token, ip]
      properties:
        token:
          type: string
        ip:
          type: string

    L4ConfigPush:
      type: object
      required: [token]
      properties:
        token:
          type: string
        id:
          type: integer
          format: int64
        dev:
          type: string
        attachMode:
          type: string
        sensitivity:
          type: string
        protectionMode:
          type: string
        blackIpDuration:
          type: integer
        synValid:
          type: boolean
        synThreshold:
          type: integer
        synBurstPkt:
          type: integer
        synBurstCountPerSec:
          type: integer
        synFixedThreshold:
          type: integer
        synFixedCheckDuration:
          type: integer
        challengeTimeout:
          type: integer
        synProtectionDuration:
          type: integer
        ackValid:
          type: boolean
        ackThreshold:
          type: integer
        ackBurstPkt:
          type: integer
        ackBurstCountPerSec:
          type: integer
        ackFixedThreshold:
          type: integer
        ackFixedCheckDuration:
          type: integer
        ackProtectionDuration:
          type: integer
        rstValid:
          type: boolean
        rstThreshold:
          type: integer
        rstBurstPkt:
          type: integer
        rstBurstCountPerSec:
          type: integer
        rstFixedThreshold:
          type: integer
        rstFixedCheckDuration:
          type: integer
        rstProtectionDuration:
          type: integer
        icmpValid:
          type: boolean
        icmpThreshold:
          type: integer
        icmpBurstPkt:
          type: integer
        icmpBurstCountPerSec:
          type: integer
        icmpFixedThreshold:
          type: integer
        icmpFixedCheckDuration:
          type: integer
        icmpProtectionDuration:
          type: integer
        udpValid:
          type: boolean
        udpThreshold:
          type: integer
        udpBurstPkt:
          type: integer
        udpBurstCountPerSec:
          type: integer
        udpFixedThreshold:
          type: integer
        udpFixedCheckDuration:
          type: integer
        udpProtectionDuration:
          type: integer
        greValid:
          type: boolean
        greThreshold:
          type: integer
        greBurstPkt:
          type: integer
        greBurstCountPerSec:
          type: integer
        greFixedThreshold:
          type: integer
        greFixedCheckDuration:
          type: integer
        greProtectionDuration:
          type: integer
        tcpSegCheck:
          type: boolean
