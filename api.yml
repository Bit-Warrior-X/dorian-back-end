openapi: 3.0.3
info:
  title: Dorian Back-End API
  description: |
    REST API for the Dorian dashboard. Manages protected servers, sites (domains),
    WAF/L4 rules, traffic settings, analytics, audit logs, and agent communication.

    Most endpoints require a bearer token obtained from `POST /auth/login`.
    Traffic mutations (cache rules, upstream servers, listening ports, compress)
    sync to the edge L7 agent (angelos) on port 5000; failures return HTTP 502.

    **Analytics and dashboard scoping**

    Many read endpoints accept optional `serverId` and `siteId` query parameters:

    - Omit both (or `siteId=all`) to aggregate across all servers/sites.
    - `serverId` narrows results to one edge node.
    - `siteId` narrows to a site domain; when `serverId` is omitted, the site's
      linked servers are used. When both are set, the server must serve that site.

    Time windows use either `range` (e.g. `30m`, `24h`, `7d`, `today`, `yesterday`)
    or explicit `start` / `end` (RFC3339 or `2006-01-02 15:04:05`).

    Duplicate routes under `/api/v1/...` mirror the root paths listed below.

    **Site and WAF rule sub-resources**

    Site-scoped WAF CRUD lives under `/sites/{siteId}/waf/{resource}` where
    `{resource}` is one of `whitelist`, `blacklist`, `geolocation`, `anti-cc`,
    `anti-header`, `interval-freq-limit`, `second-freq-limit`, `response-freq`,
    or `user-agent`. Predefined templates use the same pattern under
    `/waf-rules/{wafRuleId}/waf/{resource}`.
  version: 1.1.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Audit Logs
  - name: Dashboard
  - name: Analytics
  - name: Security Analytics
  - name: Layer 4 Analytics
  - name: Sites
  - name: WAF Rules
  - name: Servers
  - name: Cache Rules
  - name: Upstream Servers
  - name: Listening Ports
  - name: Compress

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and obtain API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out and record audit event
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [manual, idle]
                  description: Optional logout reason for audit logging
      responses:
        "204":
          description: Logged out
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit log entries
      parameters:
        - $ref: "#/components/parameters/AuditLimit"
        - name: category
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: actorUserId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Audit log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"
        "500":
          $ref: "#/components/responses/InternalError"

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Dashboard KPI totals
      responses:
        "200":
          description: Summary counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/security-events:
    get:
