  /sites:
    get:
      tags: [Sites]
      summary: List sites
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
    post:
      tags: [Sites]
      summary: Create a site
      description: |
        Creates the site, assigns edge servers, then pushes full site config to
        angelos on each assigned server via `POST /API/L7/l7_update_site`
        (domain, SSL, classified WAF rules, compress, cache rules, listening
        ports, upstreams). Every selected edge is attempted. Failed edges are
        removed from the site assignment. Response includes `edgeSync` with
        `succeeded` and `failed` arrays.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Domain already exists
        "502":
          $ref: "#/components/responses/BadGateway"

  /sites/{siteId}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      tags: [Sites]
      summary: Get a site
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Sites]
      summary: Update a site
      description: |
        Updates the site and assigned edge servers. When the domain changes,
        angelos is notified via `POST /API/L7/l7_update_domain` (old and new
        hostname). Full site config is then pushed via
        `POST /API/L7/l7_update_site`. Every selected edge is attempted. Failed
        edges are removed from the site assignment. Outdated angelos agents
        that return HTTP 404 for domain rename are reported in
        `edgeSync.warnings`. Response includes `edgeSync`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "200":
          description: Site updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain already exists
        "502":
          $ref: "#/components/responses/BadGateway"
    patch:
      tags: [Sites]
      summary: Partially update a site
      description: |
        Same as PUT — domain changes call `POST /API/L7/l7_update_domain`, then
        full site config is synced via `POST /API/L7/l7_update_site`. Failed
        edges are deselected; response includes `edgeSync`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteInput"
      responses:
        "200":
          description: Site updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      tags: [Sites]
      summary: Delete a site
      description: |
        Notifies angelos on each assigned edge server via
        `POST /API/L7/l7_delete_site`, then always removes the site from the
        database. Outdated angelos agents that return HTTP 404 (no
        `l7_delete_site` route) are reported in `edgeSync.warnings` and do not
        block deletion. Other edge notify failures are also warnings.
      responses:
        "200":
          description: Site deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteDeleteResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /sites/{siteId}/waf/fork:
    parameters:
