              schema:
                type: array
                items:
                  type: object

  /dashboard/bandwidth:
    get:
      tags: [Dashboard]
      summary: Aggregate bandwidth time series
      parameters:
        - $ref: "#/components/parameters/DashboardRange"
        - $ref: "#/components/parameters/ServerIdQuery"
