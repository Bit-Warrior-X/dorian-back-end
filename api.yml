                type: array
                items:
                  $ref: "#/components/schemas/ListeningPort"
    post:
      tags: [Listening Ports]
      summary: Create a listening port
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListeningPortInput"
      responses:
        "201":
          description: Listening port created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListeningPort"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"

  /servers/{serverId}/listening-ports/{portId}:
    parameters:
      - $ref: "#/components/parameters/ServerId"
      - name: portId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Listening Ports]
      summary: Update a listening port
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListeningPortInput"
      responses:
        "200":
          description: Listening port updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListeningPort"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      tags: [Listening Ports]
      summary: Delete a listening port
      responses:
        "204":
          description: Listening port deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

  /servers/{serverId}/listening-ports/batch-delete:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Listening Ports]
      summary: Delete multiple listening ports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchDeleteRequest"
      responses:
        "204":
          description: Listening ports deleted
        "502":
          $ref: "#/components/responses/BadGateway"

  /servers/{serverId}/listening-ports/bound:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Listening Ports]
      summary: List bound ports from the edge agent
      responses:
        "200":
          description: Bound ports reported by the L7 agent
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /servers/{serverId}/compress:
    parameters:
      - $ref: "#/components/parameters/ServerId"
    get:
      tags: [Compress]
      summary: Get Gzip compress MIME settings
      description: |
        Returns per-server Gzip compress settings by MIME category.
        Creates default settings (CSS/HTML/JS enabled) when none exist yet.
      responses:
        "200":
          description: Compress settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressSettings"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Compress]
      summary: Update Gzip compress MIME settings
      description: |
        Updates compress settings and syncs to the edge via
        `POST /API/L7/l7_update_compress`. Rolls back the DB update if L7 sync fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompressSettingsInput"
      responses:
        "200":
          description: Compress settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1033
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    WafRuleId:
      name: wafRuleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServerIdQuery:
      name: serverId
      in: query
      schema:
        type: integer
        format: int64
      description: Optional edge server filter
    SiteIdQuery:
      name: siteId
      in: query
      schema:
        type: integer
        format: int64
      description: Optional site filter; omit or use `all` for all sites
    AnalyticsRange:
      name: range
      in: query
      schema:
        type: string
        example: 24h
      description: |
        Relative window when `start`/`end` are omitted. Supports `today`,
        `yesterday`, and suffix forms like `30m`, `12h`, `7d`.
    AnalyticsStart:
      name: start
      in: query
      schema:
        type: string
        format: date-time
      description: Window start (RFC3339 or `2006-01-02 15:04:05`)
    AnalyticsEnd:
      name: end
      in: query
      schema:
        type: string
        format: date-time
      description: Window end (RFC3339 or `2006-01-02 15:04:05`)
    DashboardRange:
      name: range
      in: query
      schema:
        type: string
        default: 30m
        example: 24h
      description: |
        Relative window: `30m`, `1h`, `2h`, `4h`, `8h`, `12h`, `24h`, `48h`,
        `7d`, `1d`, `2d`, or millisecond duration.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 200

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Account blocked or pending approval
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: L7 agent sync failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Bad Gateway
            message: l7_clear_url_cache returned status 400
    MethodNotAllowed:
      description: HTTP method not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: integer
              format: int64
            email:
              type: string
            role:
              type: string
            name:
              type: string

    BatchDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64

    CacheRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        ruleName:
          type: string
        ruleType:
          type: string
          enum: [file, url]
        cachingTime:
          type: integer
          description: Cache TTL in seconds
        url:
          type: string
          description: Required when ruleType is url
        fileTypes:
          type: string
          description: Comma-separated extensions; required when ruleType is file
          example: jpg, png, mp4
        priority:
          type: integer
        cacheSlice:
          type: number
          format: double
          description: Cache slice size in MB
        withoutParameter:
          type: string
          enum: [yes, no]
        cacheMode:
          type: string
          enum: [origin, force]
        status:
          type: string
          enum: [ENABLE, DISABLE]

    CacheRuleInput:
      type: object
      required: [ruleName]
      properties:
        ruleName:
          type: string
        ruleType:
          type: string
          enum: [file, url]
          default: file
        cachingTime:
          type: integer
          minimum: 0
          default: 0
        url:
          type: string
        fileTypes:
          type: string
        priority:
          type: integer
          minimum: 0
          default: 0
        cacheSlice:
          type: number
          format: double
          minimum: 0
          default: 0
        withoutParameter:
          type: string
          enum: [yes, no]
          default: yes
        cacheMode:
          type: string
          enum: [origin, force]
          default: origin
        status:
          type: string
          enum: [ENABLE, DISABLE]
          default: ENABLE

    ClearUrlCacheRequest:
      type: object
      required: [matchType, matchContent]
      properties:
        matchType:
          type: string
          enum: [prefix, exact, advanced]
          description: |
            Match mode. Also accepts `prefix_match`, `exact_match`, `advanced_match`.
        matchContent:
          type: string
          description: |
            URL or pattern to clear. Validation depends on matchType.
            Advanced mode accepts any non-empty string.

    UpstreamServer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        address:
          type: string
          description: IP:port upstream address
        description:
          type: string
        status:
          type: string

    UpstreamServerInput:
      type: object
      required: [address]
      properties:
        address:
          type: string
        description:
          type: string
        status:
          type: string

    ListeningPort:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        port:
          type: integer
        protocol:
          type: string
        description:
          type: string
        status:
          type: string

    ListeningPortInput:
      type: object
      required: [port, protocol]
      properties:
        port:
          type: integer
        protocol:
          type: string
        description:
          type: string
        status:
          type: string

    CompressSettings:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: integer
          format: int64
        css:
          type: boolean
        html:
          type: boolean
        js:
          type: boolean
        audio:
          type: boolean
        font:
          type: boolean
        applications:
          type: boolean

    CompressSettingsInput:
      type: object
      properties:
        css:
          type: boolean
        html:
          type: boolean
        js:
          type: boolean
        audio:
          type: boolean
        font:
          type: boolean
        applications:
          type: boolean

    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        action:
          type: string
        category:
          type: string
        resourceType:
          type: string
        resourceId:
          type: integer
          format: int64
          nullable: true
        resourceName:
          type: string
        actorUserId:
          type: integer
          format: int64
          nullable: true
        actorName:
          type: string
        actorEmail:
          type: string
        actorRole:
          type: string
        ipAddress:
          type: string
        userAgent:
          type: string
        httpMethod:
          type: string
        path:
          type: string
        statusCode:
          type: integer
        details:
          type: string
        createdAt:
          type: string

    DashboardSummary:
      type: object
      properties:
        totalUsers:
          type: integer
          format: int64
        totalServers:
          type: integer
          format: int64
        activeServers:
          type: integer
          format: int64
        totalSites:
          type: integer
          format: int64
        activeSites:
          type: integer
          format: int64
        blockedIps:
          type: integer
          format: int64
        l4AttacksThisMonth:
          type: integer
          format: int64
        l4AttacksPreviousMonth:
          type: integer
          format: int64
        l7ThreatsThisMonth:
          type: integer
          format: int64
        l7ThreatsPreviousMonth:
          type: integer
          format: int64

    BandwidthSeries:
      type: object
      properties:
        serverId:
          type: integer
          format: int64
        points:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
              bandwidth:
                type: integer
                format: int64

    AnalyticsSummary:
      type: object
      properties:
        totalNicRxTraffic:
          type: integer
          format: int64
        totalNicTxTraffic:
          type: integer
          format: int64
        totalL7RxTraffic:
          type: integer
          format: int64
        totalL7TxTraffic:
          type: integer
          format: int64
        nicRxBandwidthLast:
          type: integer
          format: int64
        nicRxBandwidthLastTime:
          type: string
        nicTxBandwidthLast:
          type: integer
          format: int64
        nicTxBandwidthLastTime:
          type: string
        l7RxBandwidthLast:
          type: integer
          format: int64
        l7RxBandwidthLastTime:
          type: string
        l7TxBandwidthLast:
          type: integer
          format: int64
        l7TxBandwidthLastTime:
          type: string
        totalRequest:
          type: integer
          format: int64
        totalResponse:
          type: integer
          format: int64
        ipCount:
          type: integer
          format: int64
        refererCount:
          type: integer
          format: int64
        ispCount:
          type: integer
          format: int64

    SecurityAnalyticsSummary:
      type: object
      properties:
        totalRequestCounts:
          type: integer
          format: int64
        blockRequestCounts:
          type: integer
          format: int64
        totalIps:
          type: integer
          format: int64
        blacklistedIps:
          type: integer
          format: int64

    SecurityCountryRow:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        count:
          type: integer
          format: int64

    SecurityDomainRow:
      type: object
      properties:
        domain:
          type: string
        count:
          type: integer
          format: int64
        bandwidth:
          type: integer
          format: int64
        cacheHit:
          type: number
          format: double
        status:
          type: string

    L4Summary:
      type: object
      properties:
        totalTraffic:
          type: integer
          format: int64
        allowedTraffic:
          type: integer
          format: int64
        blockedTraffic:
          type: integer
          format: int64

    L4TrafficPoint:
      type: object
      properties:
        timestamp:
          type: string
        totalTraffic:
          type: integer
          format: int64
        allowedTraffic:
          type: integer
          format: int64
        blockedTraffic:
          type: integer
          format: int64

    L4ProtocolPoint:
      type: object
      properties:
        timestamp:
          type: string
        tcp:
          type: integer
          format: int64
        udp:
          type: integer
          format: int64
        icmp:
          type: integer
          format: int64
        gre:
          type: integer
          format: int64
        other:
          type: integer
          format: int64

    L4AttackRow:
      type: object
      properties:
        timestamp:
          type: string
        sourceIp:
          type: string
        attackType:
          type: string

    L4TopIpRow:
      type: object
      properties:
        ip:
          type: string
        count:
          type: integer
          format: int64
        lastSeen:
          type: string

    Site:
      type: object
      properties:
        id:
          type: integer
          format: int64
        domain:
          type: string
        status:
          type: string
        wafId:
          type: integer
          format: int64
        wafName:
          type: string
        wafRole:
          type: string
        certificateStatus:
          type: string
        certificateExpiry:
          type: string
          format: date-time
        cacheRatio:
          type: number
          format: double
        bandwidth:
          type: integer
          format: int64
        sslType:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        serverIds:
          type: array
          items:
            type: integer
            format: int64
        servers:
          type: array
          items:
            type: string

    EdgeSyncServer:
      type: object
      properties:
        serverId:
          type: integer
          format: int64
        name:
          type: string
        ip:
          type: string
        error:
          type: string

    EdgeSyncReport:
      type: object
      properties:
        succeeded:
          type: array
          items:
            $ref: "#/components/schemas/EdgeSyncServer"
        failed:
          type: array
          items:
            $ref: "#/components/schemas/EdgeSyncServer"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/EdgeSyncServer"

    SiteDeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
        edgeSync:
          $ref: "#/components/schemas/EdgeSyncReport"

    SiteInput:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
        status:
          type: string
        wafId:
          type: integer
          format: int64
        certificateStatus:
          type: string
        certificateExpiry:
          type: string
        cacheRatio:
          type: number
          format: double
        bandwidth:
          type: integer
          format: int64
        sslType:
          type: string
        sslCert:
          type: string
        sslCertKey:
          type: string
        serverIds:
          type: array
          items:
            type: integer
            format: int64

    WafRule:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        role:
          type: string
          enum: [predefined, custom]
        createdAt:
          type: string
          format: date-time
        siteCount:
          type: integer
        ruleCount:
          type: integer

    WafRuleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string
          enum: [predefined, custom]
